<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="BuckLab">
  <rect width="32" height="32" rx="7" fill="#f7f1e4"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#c9b99a" stroke-width="1.5"/>

  <!-- VIN potential: high -->
  <rect x="3.5" y="6" width="2.6" height="20" rx="0.6" fill="#e8dcc4"/>
  <rect x="3.5" y="8" width="2.6" height="18" rx="0.6" fill="#c4622a"/>

  <!-- VOUT potential: stepped down -->
  <rect x="25.9" y="6" width="2.6" height="20" rx="0.6" fill="#e8dcc4"/>
  <rect x="25.9" y="17" width="2.6" height="9" rx="0.6" fill="#2b5f8a"/>

  <!-- inductor, left to right -->
  <path
    d="M6.6 14.8h1.7c1.35-6.2 4.85-6.2 6.2 0 1.35-6.2 4.85-6.2 6.2 0 1.35-6.2 4.85-6.2 6.2 0h1.7"
    fill="none"
    stroke="#2c2a26"
    stroke-width="2.05"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- iL triangle: voltage steps, current ramps -->
  <path
    d="M8.2 24.6 12.4 20.2 16.6 24.6 20.8 20.2 24 23.4"
    fill="none"
    stroke="#c4622a"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
